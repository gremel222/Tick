<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <!-- viewport-fit=cover — чтобы фон заходил под «вырез» и полоску «домой» на iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Счётчик вахты</title>
  <meta name="description" content="Отсчёт дней вахты, учёт заработка и расходов, расчётные листки. Работает офлайн, данные хранятся только на устройстве." />

  <!-- Установка на экран «Домой» в iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Вахта" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="theme-color" content="#0E0F11" />
  <meta name="color-scheme" content="dark" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="appbar">
      <button class="icon-btn hidden" id="app-back" data-act="back" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h1 class="appbar__title" id="app-title">Вахта</h1>
    </header>

    <main class="screen" id="screen">
      <p class="muted center">Загрузка…</p>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Разделы приложения"></nav>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <noscript>
    <p style="padding:16px">Для работы приложения нужен JavaScript.</p>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
