name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/01a08ea0-tick]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать статику (клиент как есть + SPA-фолбэк)
        run: |
          rm -rf _site
          cp -r client _site
          cp _site/index.html _site/404.html   # SPA-фолбэк для deep-links
          touch _site/.nojekyll               # не мешать папкам с _ и т.п.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
