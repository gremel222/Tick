# Готовый workflow для GitHub Actions: сам скачивает русское руководство Blender
# и коммитит готовые шарды в blender/data/ru/.
#
# Как поставить (файлы .github/workflows нельзя загрузить из агентской среды —
# GitHub требует отдельного разрешения на workflows):
#   1. Откройте https://github.com/gremel222/Tick → Add file → Create new file
#   2. Имя файла: .github/workflows/crawl-blender-docs.yml
#   3. Вставьте содержимое этого файла (без строк комментария сверху — они допустимы)
#   4. Commit changes → вкладка Actions → «Обновление русского руководства» → Run workflow
#
# После прогона в репозитории появятся blender/data/ru/*.json.gz,
# а сайт начнёт показывать страницы справочника по-русски.

name: Обновление русского руководства Blender

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Раздел (пусто — все), например editors'
        required: false
        default: ''
      limit:
        description: 'Сколько страниц на раздел (0 — все)'
        required: false
        default: '0'
  schedule:
    - cron: '0 4 1 * *'   # первое число каждого месяца

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Скачать русские страницы руководства
        run: |
          node blender/tools/build-data.mjs
          node blender/tools/crawl-ru.mjs \
            ${{ inputs.section && format('--section {0}', inputs.section) || '' }} \
            ${{ inputs.limit != '0' && inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Проверить поиск
        run: node blender/tools/test-search.mjs

      - name: Закоммитить изменения
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add blender/data
          if git diff --cached --quiet; then
            echo 'Изменений нет — руководство уже актуально'
          else
            git commit -m 'data: обновление русского руководства Blender'
            git push
          fi
